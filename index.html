<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIA | Boutique Relocation Services</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script>
        (function () {
            emailjs.init("kcX6p2ITpMpxi-ZYc");
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap');

        body { font-family: 'Inter', sans-serif; }

        .selection-red::selection {
            background-color: #E31837;
            color: white;
        }

        .nav-transition {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hero-gradient {
            background: linear-gradient(to right, #020617 0%, rgba(2, 6, 23, 0.7) 50%, transparent 100%);
        }

        .mobile-menu {
            display: none;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .mobile-menu.active {
            display: flex;
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>

<body class="bg-white text-slate-800 selection-red overflow-x-hidden">

    <!-- NAV, HERO, CONTENT — unchanged -->
    <!-- … everything above remains exactly as you provided … -->

    <!-- CTA -->
    <section id="contact" class="py-40 bg-[#002B49] text-white text-center">
        <h2 class="text-4xl md:text-6xl font-light mb-10">
            Let’s talk about your move to Argentina.
        </h2>
        <p class="text-slate-400 mb-12 max-w-2xl mx-auto">
            We are happy to review your situation and explain how the process would work in your case.
        </p>

        <form id="contact-form" class="max-w-md mx-auto relative">
            <input
                type="email"
                name="user_email"
                required
                placeholder="Your email address"
                class="w-full bg-transparent border-b border-white/20 pb-4 pt-2 text-sm text-white placeholder-white/50 focus:outline-none focus:border-[#E31837]"
            >

            <button
                type="submit"
                class="absolute right-0 top-0 text-[10px] font-bold uppercase tracking-[0.2em] text-[#E31837]"
            >
                Request a call
            </button>
        </form>

        <p id="form-success" class="text-slate-400 text-sm mt-6 hidden">
            Thank you. We will contact you shortly.
        </p>

        <p id="form-error" class="text-red-400 text-sm mt-6 hidden">
            Something went wrong. Please try again.
        </p>
    </section>

    <script>
        lucide.createIcons();
    </script>

    <!-- EmailJS send logic -->
    <script>
        document.getElementById("contact-form").addEventListener("submit", function (event) {
            event.preventDefault();

            emailjs.sendForm(
                "service_huqa16f",
                "template_h9ys2b8",
                this
            ).then(
                function () {
                    document.getElementById("form-success").classList.remove("hidden");
                    document.getElementById("form-error").classList.add("hidden");
                    document.getElementById("contact-form").reset();
                },
                function () {
                    document.getElementById("form-error").classList.remove("hidden");
                    document.getElementById("form-success").classList.add("hidden");
                }
            );
        });
    </script>

</body>
</html>
